<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Merging</title>
    <link rel="shortcut icon" href="../ex022/imagens/imgtittlesite.ico" type="image/x-icon">
    <link rel="stylesheet" href="style-table003.css">
</head>
</head>
<body>
    <h1>Cell Merging</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td colspan="2">I</td>
        </tr>
    </table>
</body>
</html>
