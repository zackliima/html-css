<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Social NetWork</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,GRAD,opsz,wght@0..1,-50..200,20..48,100..700"/>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style-media-queries.css">
</head>
<body>
    <main>
        <section id="main-login">
            <div id="image-form">
                
            </div>
            <div id="form-login">
                <h1>You're Welcome!</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam quia veniam delectus. Perspiciatis molestiae aspernatur, ex fugit totam beatae, officia saepe deleniti reiciendis harum iure et. Modi officiis ad velit?</p>
                
                <form action="login.php" method="post" autocomplete="on">
                    <div class="field">
                        <span class="material-symbols-outlined icon-person">Person</span>
                        <input type="email" name="email" id="iemail" required maxlength="60" size="27" placeholder="Your Email" autocomplete="email">
                        <label for="iemail">Email</label>
                    </div>
                    
                    <div class="field">
                        <span class="material-symbols-outlined icon-lock">Lock</span>
                        <input type="password" name="pass" id="ipass" required minlength="8" maxlength="30" size="27" placeholder="Your Password" autocomplete="current-password">
                        <label for="ipass">Password</label>
                    </div>
                    
                    <div class="field-login">
                        <input type="submit" value="Login">
                    </div>
                    
                    <div class="field-end">
                        <a href="forget.html">Forgot your password?</a>
                        <span class="material-symbols-outlined">Mail</span>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
