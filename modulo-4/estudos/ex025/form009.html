<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Example Form</h1>
    <form action="" method="post">
        <div>
            <label for="inum">Number: </label>
            <input type="range" name="num" id="inum" min="1" max="100" value="50" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">50</output>
        </div>
        <div>
            <input type="submit" value="Send">
            <input type="reset" value="Clean">
        </div>
    </form>
</body>
</html>
