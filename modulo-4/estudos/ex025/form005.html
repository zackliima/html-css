<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing New Tags</title>
</head>
<body>
    <h1>Example Form With Radio and Checkbox</h1>
    <form action="" method="get" autocomplete="off">
        <fieldset>
            <legend>Sex</legend>
            <div>
                <input type="radio" name="sex" id="ifemale"> <label for="ifemale">Female</label></br>
                <input type="radio" name="sex" id="imale"> <label for="imale">Male</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Favorite Sports</legend>
            <div>
                <input type="checkbox" name="bas" id="ibas"> <label for="ibas">Basketball</label> 
            </div>
            <div>
                <input type="checkbox" name="ten" id="iten"> <label for="iten"> Tennis</label>
            </div>
            <div>
                <input type="checkbox" name="swi" id="iswi"> <label for="iswi"> Swimming</label>
            </div>
            <div>
                <input type="checkbox" name="soc" id="isoc"> <label for="isoc"> Soccer</label>
            </div>
            <div>
                <input type="checkbox" name="gol" id="igol"> <label for="igol"> Golf</label>
            </div>
            <div>
                <input type="checkbox" name="run" id="irun"> <label for="irun">Running</label>
            </div>
            <div>
                <input type="checkbox" name="gym" id="igym"> <label for="igym">Gymnastics</label>
            </div>
        </fieldset>
        <div>
            <input type="submit" value="Send">
            <input type="reset" value="Clean">
        </div>
    </form>
</body>
</html>
