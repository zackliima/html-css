<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Sample Form</h1>
    <form action="" method="post" autocomplete="off">
        <div>
            <label for="icolor">Color: </label>
            <input type="color" name="color" id="icolor" value="#b0b0b0">
        </div>
        <div>
            <label for="irange">Satisfaction Level: </label>
            <input type="range" name="range" id="irange">
        </div>
        <div>
            <label for="ifile">Profile Picture: </label>
            <input type="file" name="file" id="ifile">
        </div>
        <div>
            <input type="submit" value="Send">
            <input type="reset" value="Clean">
        </div>
    </form>
</body>
</html>
