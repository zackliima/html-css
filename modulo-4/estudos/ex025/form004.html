<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Test</title>
</head>
<body>
    <h1>Testing New Tags on Forms</h1>
    <form action="" method="post" autocomplete="on">
        <fieldset>
            <legend>Personal Data</legend>
            <div>
                <label for="iname">Name: </label>
                <input type="text" name="name" id="iname" required placeholder="Enter Your Name">
            </div>
            <div>
                <label for="iemail">Email: </label>
                <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="Write Your Email">
            </div>
            <div>
                <label for="iphone">Number Cellphone: </label>
                <input type="tel" name="phone" id="iphone" required autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx) xxxx-xxxx"> <!-- Aprender mais sobre RegEx!!! pattern="^\(\d{2}\)\d{4,5}-\d{4}$" <<<--- -->
            </div>
        </fieldset>
            <div>
                <input type="submit" value="Send">
                <input type="reset" value="Clean">
            </div>
    </form>
</body>
</html>
